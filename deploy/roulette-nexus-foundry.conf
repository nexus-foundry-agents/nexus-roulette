# roulette.nexus-foundry.ai - the Roulette module for Nexus Casino.
#
# This is a separate origin on purpose. Casino frames it with scripts and the module's own origin;
# serving these bytes from the Casino origin would let the application reach Casino DOM, storage and
# credentials. The host is public but frameable only by Casino.

server {
    listen 80;
    listen [::]:80;
    server_name roulette.nexus-foundry.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name roulette.nexus-foundry.ai;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin/origin.key;

    # `current` is atomically replaced with a symlink to an immutable commit-addressed release.
    root /var/www/casino-module-roulette/current;
    index index.html;

    # The application is an existing single-file bundle: its React code and styles are inline.
    # Account sync crosses only the parent-window bridge, so this origin needs no third-party
    # script, connection, image or frame destination.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'none'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; frame-ancestors https://casino.nexus-foundry.ai; base-uri 'none'; form-action 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # The shell fetches this document. One named reader, never a wildcard, and a short cache so a
    # corrected declaration becomes visible without manual cache clearing.
    location = /module.json {
        add_header Access-Control-Allow-Origin "https://casino.nexus-foundry.ai" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "public, max-age=60" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors https://casino.nexus-foundry.ai; base-uri 'none'; form-action 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        default_type application/json;
        try_files $uri =404;
    }

    # Update discovery and the service worker must never sit behind a stale edge entry.
    location = /version.json {
        # `expires`, not a location-level add_header: nginx would otherwise discard every
        # server-level security header in this location.
        expires epoch;
        try_files $uri =404;
    }
    location = /sw.js {
        expires epoch;
        try_files $uri =404;
    }

    # /play is the contract route. Missing named assets 404; route-like paths fall back to the SPA.
    location = /play {
        expires -1;
        try_files /index.html =404;
    }
    location ~* \.(?:js|json|svg|png|jpg|jpeg|webp|ico|woff|woff2)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
