<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nexus Roulette">
<meta name="theme-color" content="#0f1923">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Nexus Roulette Tracker</title>
<style>
/*
 * Nexus Foundry UI tokens.
 *
 * ⚠️ LIFTED VERBATIM FROM nexus-foundry.ai/assets/css/site.css. They are not
 * "inspired by" the brand, they ARE the brand's values. When the brand moves,
 * it moves here by copying those values again — never by improving them here.
 *
 * This file is the ONLY place a Nexus Foundry colour is written down. Every
 * component in this package reads tokens; none of them contains a hex code.
 * That is what makes the package reusable: a consuming app can override a token
 * and every control follows, without touching component source.
 */

:root {
  --nf-black: #020206;
  --nf-near-black: #07080d;
  --nf-panel: #0b0d13;
  --nf-panel-strong: #10131b;
  --nf-cyan: #00d8ff;
  --nf-blue: #1768ff;
  --nf-pink: #ff188d;
  --nf-white: #ffffff;
  --nf-muted: #bcc4d2;
  --nf-dim: #7e8798;

  --nf-line: rgba(255, 255, 255, 0.16);
  --nf-line-soft: rgba(255, 255, 255, 0.08);
  --nf-hover: rgba(255, 255, 255, 0.06);

  /* The house gradient. Blue to pink — NOT cyan to pink. */
  --nf-gradient: linear-gradient(135deg, rgba(23, 104, 255, 0.34), rgba(255, 24, 141, 0.28));
  --nf-glow-blue: 0 0 28px rgba(23, 104, 255, 0.32);
  --nf-glow-cyan: 0 0 28px rgba(0, 216, 255, 0.24);

  --nf-heading: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --nf-body: Rajdhani, Arial, sans-serif;

  --nf-radius: 4px;
  --nf-pop-shadow: 0 2px 8px rgba(0, 0, 0, .6), 0 18px 48px rgba(0, 0, 0, .5);

  /* Layering. Popovers must clear app chrome without an arms race. */
  --nf-z-popover: 9000;
}

/*
 * Nexus Foundry UI — control surfaces.
 *
 * Every rule here reads a token from tokens.css. No hex codes below this line.
 */

/* ── Scrollbars ───────────────────────────────────────────────────────────── */

/*
 * TWO SYNTAXES ON PURPOSE, AND THEY ARE NOT REDUNDANT.
 *
 * `scrollbar-color` is the standard and is the only thing Firefox honours, but
 * it takes exactly two colours and nothing else — no radius, no hover state.
 * `::-webkit-scrollbar` is the non-standard one that Chrome, Edge and Brave
 * actually use, and it can be styled properly.
 *
 * A browser applies whichever it understands, so both must describe the SAME
 * scrollbar. If they drift, the app looks different per browser and nobody
 * notices until a user says "it looks wrong on my machine".
 */
* {
  scrollbar-color: var(--nf-line) transparent;
  scrollbar-width: thin;
}

*::-webkit-scrollbar { width: 11px; height: 11px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--nf-line);
  border-radius: 999px;
  /* Transparent border + background-clip keeps the thumb visually inset without
     changing the scrollbar's hit area, which is what makes thin thumbs hard to
     grab when you shrink them instead. */
  border: 3px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--nf-dim); background-clip: content-box; }
*::-webkit-scrollbar-thumb:active { background: var(--nf-cyan); background-clip: content-box; }
*::-webkit-scrollbar-corner { background: transparent; }

/* ── Select ───────────────────────────────────────────────────────────────── */

.nf-select {
  position: relative;
  display: inline-flex;
  min-width: 0;
}

.nf-select__trigger {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-width: 0;
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  color: var(--nf-white);
  font-family: var(--nf-body);
  font-size: inherit;
  padding: 7px 10px;
  cursor: pointer;
  text-align: left;
  transition: border-color .12s, box-shadow .12s;
}
.nf-select__trigger:hover:not(:disabled) { border-color: var(--nf-cyan); }
.nf-select__trigger:focus-visible { outline: 2px solid var(--nf-cyan); outline-offset: 1px; }
.nf-select__trigger[aria-expanded="true"] { border-color: var(--nf-cyan); box-shadow: var(--nf-glow-cyan); }
.nf-select__trigger:disabled { opacity: .45; cursor: not-allowed; }

/*
 * Every label stacked in ONE grid cell. The cell is as wide as the widest
 * child, so the trigger's width is a property of the OPTION LIST, not of the
 * current value — which is what stops the control moving when you use it.
 */
.nf-select__value-wrap {
  display: grid;
  grid-template-areas: "v";
  min-width: 0;
}
.nf-select__value-wrap > * { grid-area: v; }

.nf-select__sizer {
  visibility: hidden;   /* not display:none — a removed element reserves no width */
  white-space: nowrap;
  pointer-events: none;
  height: 0;            /* contributes width only, never height */
  overflow: hidden;
}

.nf-select__value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.nf-select__value[data-placeholder="true"] { color: var(--nf-dim); }

.nf-select__caret {
  flex: none;
  width: 9px;
  height: 9px;
  border-right: 2px solid var(--nf-dim);
  border-bottom: 2px solid var(--nf-dim);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform .14s, border-color .12s;
}
.nf-select__trigger[aria-expanded="true"] .nf-select__caret {
  transform: rotate(-135deg) translate(-3px, -3px);
  border-color: var(--nf-cyan);
}

/*
 * The popup. Rendered in a portal at the document root, NOT inside the trigger.
 *
 * A popup nested in the control is clipped by any ancestor with overflow:hidden
 * or a transform — and this app's panels have both. Portalling is the only way a
 * list can escape a scrolling sidebar, which is exactly where these live.
 */
.nf-menu {
  position: fixed;
  z-index: var(--nf-z-popover);
  min-width: 160px;
  max-height: 288px;
  overflow-y: auto;
  margin: 0;
  padding: 4px;
  list-style: none;
  background: var(--nf-panel-strong);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  box-shadow: var(--nf-pop-shadow);
  font-family: var(--nf-body);
  color: var(--nf-white);
  /* Declared dark so a forced-dark extension has nothing to "fix". */
  color-scheme: dark;
}

.nf-menu__item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 10px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
/*
 * ACTIVE IS KEYBOARD/POINTER FOCUS; SELECTED IS THE CURRENT VALUE. They are
 * different states and must look different — collapsing them is why so many
 * custom selects lose the user's place the moment they arrow away from the
 * chosen option.
 */
.nf-menu__item[data-active="true"] { background: var(--nf-hover); }
.nf-menu__item[data-selected="true"] { background: var(--nf-gradient); }
.nf-menu__item[data-selected="true"][data-active="true"] { box-shadow: inset 0 0 0 1px var(--nf-cyan); }
.nf-menu__item[data-disabled="true"] { opacity: .4; cursor: not-allowed; }

.nf-menu__check { color: var(--nf-cyan); font-size: 12px; flex: none; }

.nf-menu__sep {
  height: 1px;
  margin: 4px 2px;
  background: var(--nf-line-soft);
  list-style: none;
}

.nf-menu__label {
  padding: 6px 10px 3px;
  font-family: var(--nf-heading);
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--nf-dim);
}

@media (prefers-reduced-motion: reduce) {
  .nf-select__caret { transition: none; }
}

/* ── Colour picker ────────────────────────────────────────────────────────── */

.nf-cp { display: inline-flex; }

.nf-cp__trigger {
  width: 30px; height: 30px;
  padding: 3px;
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  cursor: pointer;
}
.nf-cp__trigger:hover:not(:disabled) { border-color: var(--nf-cyan); }
.nf-cp__trigger:focus-visible { outline: 2px solid var(--nf-cyan); outline-offset: 1px; }
.nf-cp__trigger[aria-expanded="true"] { border-color: var(--nf-cyan); box-shadow: var(--nf-glow-cyan); }

.nf-cp__chip { display: block; width: 100%; height: 100%; border-radius: 2px; }
/* "Automatic" is drawn as a split, not as an empty box: an empty swatch reads
   as "no colour set yet" when it actually means "the app decides". */
.nf-cp__chip[data-auto="true"] {
  background: linear-gradient(135deg, #fdfcfa 0 50%, #1a1712 50% 100%);
}

.nf-cp__pop {
  position: fixed;
  z-index: var(--nf-z-popover);
  width: 232px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  background: var(--nf-panel-strong);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  box-shadow: var(--nf-pop-shadow);
  color-scheme: dark;
}

/* Saturation across, value down, over the current hue. */
.nf-cp__field {
  position: relative;
  height: 118px;
  border-radius: 3px;
  cursor: crosshair;
  touch-action: none;
  background:
    linear-gradient(to top, #000, transparent),
    linear-gradient(to right, #fff, var(--hue, #f00));
}
.nf-cp__cursor {
  position: absolute;
  width: 13px; height: 13px;
  margin: -7px 0 0 -7px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.4);
  pointer-events: none;
}

.nf-cp__hue {
  position: relative;
  height: 13px;
  border-radius: 999px;
  cursor: ew-resize;
  touch-action: none;
  background: linear-gradient(to right,
    #f00 0%, #ff0 17%, #0f0 33%, #0ff 50%, #00f 67%, #f0f 83%, #f00 100%);
}
.nf-cp__hue-knob {
  position: absolute; top: 50%;
  width: 15px; height: 15px;
  margin: -8px 0 0 -8px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0,0,0,.6);
  pointer-events: none;
}

.nf-cp__presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
.nf-cp__preset {
  aspect-ratio: 1;
  border: 1px solid var(--nf-line);
  border-radius: 3px;
  padding: 0;
  cursor: pointer;
}
.nf-cp__preset[aria-pressed="true"] { outline: 2px solid var(--nf-cyan); outline-offset: 1px; }

.nf-cp__row { display: flex; gap: 6px; }
.nf-cp__hex {
  flex: 1; min-width: 0;
  background: rgba(255,255,255,.04);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  color: var(--nf-white);
  font-family: var(--nf-body);
  padding: 5px 7px;
  font-size: 13px;
}
.nf-cp__auto {
  background: rgba(255,255,255,.05);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  color: var(--nf-white);
  font-family: var(--nf-body);
  font-size: 12.5px;
  padding: 5px 9px;
  cursor: pointer;
  white-space: nowrap;
}
.nf-cp__auto[aria-pressed="true"] { background: var(--nf-gradient); border-color: var(--nf-blue); }

/* ── Update banner ────────────────────────────────────────────────────────── */

/*
 * ⚠️ TOP BY DEFAULT. Operator, 2026-09-02: "I was hoping for more of a banner on
 * the top... I might miss it if it's on the bottom." A notice placed where the
 * eye does not go is a notice that does not exist, and the bottom edge is also
 * where browsers put download bars and cookie tape — company that teaches people
 * to ignore the strip.
 */
.nf-update {
  position: fixed;
  left: 0; right: 0; top: 0;
  z-index: var(--nf-z-popover);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 14px;
  font-family: var(--nf-body);
  font-size: 14px;
  color: var(--nf-white);
  background: var(--nf-panel-strong);
  border-bottom: 1px solid var(--nf-blue);
  box-shadow: 0 8px 24px rgba(0, 0, 0, .38);
  color-scheme: dark;
}

.nf-update__subject { font-weight: 700; }
/* The one-line description of what actually changed — the thing he asked for. */
.nf-update__desc {
  color: var(--nf-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 46ch;
}

/* Opt-in bottom placement, for a surface where the top edge is already spoken for. */
.nf-update[data-position="bottom"] {
  top: auto;
  bottom: 0;
  border-bottom: 0;
  border-top: 1px solid var(--nf-blue);
  box-shadow: 0 -8px 24px rgba(0, 0, 0, .38);
}
.nf-update__spacer { flex: 1; }

.nf-update__commit {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11.5px;
  color: var(--nf-dim);
  border: 1px solid var(--nf-line);
  border-radius: 4px;
  padding: 1px 6px;
}

.nf-update__info {
  background: transparent;
  border: 1px solid var(--nf-line);
  color: var(--nf-cyan);
  border-radius: 50%;
  width: 22px; height: 22px;
  padding: 0;
  font-family: var(--nf-body);
  font-size: 13px;
  cursor: pointer;
}
.nf-update__info:hover { border-color: var(--nf-cyan); }

.nf-update__reload {
  background: var(--nf-gradient);
  border: 1px solid var(--nf-blue);
  color: var(--nf-white);
  border-radius: var(--nf-radius);
  padding: 6px 14px;
  font-family: var(--nf-body);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}
.nf-update__reload:hover { box-shadow: var(--nf-glow-blue); }

.nf-update__later {
  background: transparent;
  border: 1px solid var(--nf-line);
  color: var(--nf-dim);
  border-radius: var(--nf-radius);
  padding: 6px 12px;
  font-family: var(--nf-body);
  font-size: 13px;
  cursor: pointer;
}
.nf-update__later:hover { color: var(--nf-white); border-color: var(--nf-dim); }

.nf-update__overlay {
  position: fixed;
  inset: 0;
  z-index: calc(var(--nf-z-popover) + 10);
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(2, 2, 6, .72);
}

.nf-update__panel {
  background: var(--nf-panel);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  padding: 18px;
  max-width: 620px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--nf-pop-shadow);
  font-family: var(--nf-body);
  color: var(--nf-white);
}

.nf-update__title {
  margin: 0;
  font-family: var(--nf-heading);
  font-size: 21px;
  text-transform: uppercase;
  letter-spacing: .02em;
}
.nf-update__meta {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11.5px;
  color: var(--nf-dim);
  margin-top: 4px;
}
.nf-update__label {
  font-family: var(--nf-heading);
  font-size: 11.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--nf-dim);
  margin-top: 14px;
}
.nf-update__pre {
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 14px;
  line-height: 1.6;
  margin: 10px 0 0;
}
.nf-update__recent {
  font-family: ui-monospace, Consolas, monospace;
  font-size: 11.5px;
  color: var(--nf-dim);
  line-height: 1.85;
  margin: 6px 0 0;
  padding-left: 0;
  list-style: none;
}
.nf-update__actions { display: flex; gap: 8px; margin-top: 16px; }

/* ── Buttons ──────────────────────────────────────────────────────────────── */

/*
 * ⚠️ THE MOST-USED CONTROL, AND IT WAS THE LAST ONE TO GET HERE. Operator, on
 * reading the handoff: "Are the nice NF buttons included there?" They were not —
 * they lived in one app's stylesheet, which means the control most likely to
 * drift between products was the only one nothing was holding together.
 *
 * Offered as CLASSES first, not just a component. A button gets rendered by
 * plain HTML, by a link, by a form submit and by markup that predates React; a
 * component-only button quietly leaves all of those looking like someone else's
 * product.
 */

.nf-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  color: var(--nf-white);
  font-family: var(--nf-body);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 7px 13px;
  cursor: pointer;
  text-decoration: none;
  transition: border-color .12s, background .12s, box-shadow .12s;
}
.nf-btn:hover:not(:disabled):not([aria-disabled="true"]) { border-color: var(--nf-cyan); box-shadow: var(--nf-glow-cyan); }
.nf-btn:focus-visible { outline: 2px solid var(--nf-cyan); outline-offset: 1px; }
.nf-btn:disabled,
.nf-btn[aria-disabled="true"] { opacity: .42; cursor: not-allowed; box-shadow: none; }

/*
 * The house gradient: NF BLUE to PINK. Not cyan — operator ruling 2026-09-02,
 * "I think we're using kind of the cyan color instead of our blue color".
 * Cyan keeps its own job as the focus ring and the secondary hover.
 */
.nf-btn--primary {
  background: linear-gradient(135deg, rgba(23, 104, 255, .30), rgba(255, 24, 141, .26));
  border-color: var(--nf-blue);
}
.nf-btn--primary:hover:not(:disabled) { box-shadow: var(--nf-glow-blue); }

.nf-btn--ghost { background: transparent; }
.nf-btn--danger { border-color: var(--nf-danger, #ff5c5c); color: var(--nf-danger, #ff5c5c); }
.nf-btn--sm { padding: 4px 9px; font-size: 13px; }
.nf-btn--lg { padding: 10px 18px; font-size: 15px; }
/* Square, for a single glyph. min-width keeps a row of them from jittering. */
.nf-btn--icon { padding: 4px 8px; min-width: 30px; }
.nf-btn--block { width: 100%; }

/* ── Segmented control ────────────────────────────────────────────────────── */

/*
 * The same family as the buttons, and the reason it is here rather than in an
 * app: it is what a small set of exclusive choices should look like everywhere,
 * and it is the control most often re-implemented as "three buttons, one of them
 * highlighted" — which loses the pressed state to a screen reader.
 */
.nf-seg {
  display: flex;
  border: 1px solid var(--nf-line);
  border-radius: var(--nf-radius);
  overflow: hidden;
}
.nf-seg > button {
  flex: 1;
  background: rgba(255, 255, 255, .03);
  border: 0;
  color: var(--nf-dim);
  font-family: var(--nf-body);
  font-size: 13px;
  font-weight: 600;
  padding: 6px 10px;
  white-space: nowrap;
  cursor: pointer;
}
.nf-seg > button:hover:not([aria-pressed="true"]) { color: var(--nf-white); }
.nf-seg > button:focus-visible { outline: 2px solid var(--nf-cyan); outline-offset: -2px; }
/* aria-pressed drives the visual, so the accessible state and the look can never
   disagree — the failure mode of "three buttons with a highlight class". */
.nf-seg > button[aria-pressed="true"] {
  background: linear-gradient(135deg, rgba(23, 104, 255, .34), rgba(255, 24, 141, .28));
  color: var(--nf-white);
}

.nf-spinner {
  width: 13px; height: 13px;
  border: 2px solid var(--nf-line);
  border-top-color: var(--nf-cyan);
  border-radius: 50%;
  animation: nf-spin .7s linear infinite;
  display: inline-block;
  flex: none;
}
@keyframes nf-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .nf-spinner { animation: none; } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#0f1923;min-height:100%;}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font-family:inherit;cursor:pointer;}
*,*::before,*::after{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;}
#root{min-height:100vh;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style>
<script>
// Pre-app update check — runs before React, works even when HTML is cached
(function(){
  var MY_V="0.47.0";
  try{
    fetch("version.json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){
      if(d.version && d.version!==MY_V && !sessionStorage.getItem("nexus_updating")){
        sessionStorage.setItem("nexus_updating","1");
        // Do NOT delete caches or unregister here. The worker is versioned: a new
        // sw.js installs under a new cache name and its activate handler retires the
        // old one only AFTER the new required shell is cached. Deleting first opened
        // a window where a client that lost connectivity had no cache at all — and
        // the old code did it origin-wide, taking every other app on the host with it.
        //
        // Reload only once the new worker is ACTIVATED. update() resolves as soon as
        // the worker reaches "installing", well before its precache finishes, so
        // reloading on that promise can land a cache-busted URL on the old worker
        // with nothing cached under that query string. On failure we stay put: the
        // page keeps working on the version it already has and retries next launch.
        var go=function(){window.location.href=window.location.pathname+"?v="+Date.now();};
        var stay=function(){try{sessionStorage.removeItem("nexus_updating");}catch(e){}};
        if('serviceWorker' in navigator&&navigator.serviceWorker.getRegistration){
          navigator.serviceWorker.getRegistration().then(function(reg){
            if(!reg){go();return;}
            return reg.update().then(function(){
              var sw=reg.installing||reg.waiting;
              if(!sw){go();return;}
              if(sw.state==="activated"){go();return;}
              sw.addEventListener("statechange",function(){
                if(sw.state==="activated")go();
                else if(sw.state==="redundant")stay();
              });
            });
          }).catch(stay);
        } else { go(); }
      } else {
        sessionStorage.removeItem("nexus_updating");
      }
    });
  }catch(e){}
})();
</script>
</head>
<body>
<div id="root"></div>
